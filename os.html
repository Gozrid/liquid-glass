<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>fableOS — ein Betriebssystem im Browser</title>
  <meta name="description" content="fableOS: Fenster-Manager, Dock, Terminal mit virtuellem Dateisystem und zehn Apps – komplett im Browser, gebaut von Claude Fable 5.2.">
  <meta name="theme-color" content="#05060f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='6' y1='3' x2='26' y2='30' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23ffc078'/%3E%3Cstop offset='.42' stop-color='%23ff5d6c'/%3E%3Cstop offset='.8' stop-color='%239a6bff'/%3E%3Cstop offset='1' stop-color='%2345c8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2.5s10 9.800 10 17.200a10 10 0 0 1-20 0C6 12.300 16 2.500 16 2.500z' fill='url(%23g)'/%3E%3C/svg%3E">
  <script>
    try { var s = JSON.parse(localStorage.getItem('fableos.settings') || '{}'); if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
  </script>
  <!-- Opt-in für den Seitenübergang muss vor dem ersten Frame bekannt sein, daher inline -->
  <style>@view-transition { navigation: auto; }</style>
  <link rel="stylesheet" href="assets/css/core.css">
  <link rel="stylesheet" href="assets/css/os.css">
  <script type="module" src="assets/js/os/main.js"></script>
</head>
<body class="os">
  <canvas id="wallpaper" aria-hidden="true"></canvas>

  <div id="desktop">
    <header id="menubar" class="glass">
      <div id="mb-left" class="mb-side"></div>
      <div id="mb-right" class="mb-side"></div>
    </header>

    <div id="icons" aria-label="Schreibtisch"></div>
    <div id="widgets"></div>
    <div id="windows"></div>
    <div id="snap" aria-hidden="true"></div>
    <div id="rubber" hidden aria-hidden="true"></div>

    <footer id="dock" class="glass" data-refract="12,30" aria-label="Dock"></footer>
    <div id="dock-tip" class="glass thick" aria-hidden="true"></div>

    <div id="overlays">
      <div id="cc" class="glass thick" hidden aria-label="Kontrollzentrum"></div>
      <div id="notes" aria-live="polite"></div>
      <div id="launcher" hidden>
        <div class="launcher glass thick" role="dialog" aria-modal="true" aria-label="Suche">
          <div class="launcher-field"><i data-icon="search"></i><input id="launcher-input" type="text" placeholder="Apps, Dateien, Befehle, 12 × 7 …" autocomplete="off" spellcheck="false" aria-label="Suchen"><kbd>esc</kbd></div>
          <ul class="launcher-list scroll" id="launcher-list" role="listbox"></ul>
        </div>
      </div>
    </div>
  </div>

  <div id="dimmer" aria-hidden="true"></div>

  <div id="lock" hidden role="button" tabindex="0" aria-label="Entsperren">
    <div class="lock-top">
      <div class="lock-date" id="lock-date"></div>
      <div class="lock-time" id="lock-time">00:00</div>
    </div>
    <div class="lock-mid"></div>
    <div class="lock-bottom">
      <span class="lock-avatar" data-logo></span>
      <b id="lock-user">Gast</b>
      <span class="lock-hint">Klicken oder eine Taste drücken</span>
    </div>
  </div>

  <div id="boot">
    <div class="boot-logo" data-logo></div>
    <div class="boot-name">fableOS</div>
    <div class="boot-bar" id="boot-bar"><i></i></div>
    <p class="boot-msg" id="boot-msg">&nbsp;</p>
  </div>

  <div id="off" aria-hidden="true"></div>

  <noscript><p style="position:fixed;inset:auto 16px 16px;z-index:99999;padding:14px;border-radius:14px;background:#12142a;color:#fff;text-align:center">fableOS braucht JavaScript, um zu starten.</p></noscript>
</body>
</html>
